<script>
// Open PDFs (CV, MSci report) and all links to other websites in a new tab.
// Covers the navbar icons, the buttons under the profile photo and page links.
document.querySelectorAll('a[href]').forEach(a => {
  const href = a.getAttribute('href');
  const isPdf = /\.pdf($|[?#])/i.test(href);
  const isExternal = a.host && a.host !== window.location.host && /^https?:/.test(a.protocol);
  if (isPdf || isExternal) {
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener');
  }
});
</script>
